name: crm-dev

# Dev-only fixed credentials, reachable only on 127.0.0.1. Production passwords come from the
# host's secret store (UNI-08; docs/runbooks/phase-1-database-roles.md).
x-db-urls: &db-urls
  DATABASE_URL: postgres://crm_app:crm-app-dev-only@postgres:5432/crm
  DATABASE_MIGRATOR_URL: postgres://crm_migrator:crm-migrator-dev-only@postgres:5432/crm

x-app: &app
  image: crm-app:dev
  env_file:
    - path: ../.env
      required: true
  environment: *db-urls
  read_only: true
  tmpfs:
    - /tmp
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-only
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates or repairs the five roles once, then exits (plan Task 1; runbook phase-1-database-roles).
  bootstrap:
    <<: *app
    pull_policy: never
    command: ["bootstrap"]
    restart: "no"
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres-dev-only@postgres:5432/crm
      CRM_MIGRATOR_PASSWORD: crm-migrator-dev-only
      CRM_APP_PASSWORD: crm-app-dev-only
      CRM_WORKER_PASSWORD: crm-worker-dev-only
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["web"]
    environment:
      <<: *db-urls
      # Dev only: no edge in front, and Next fills a missing X-Forwarded-For from the socket address. The port is
      # reachable only on 127.0.0.1, so a forged header only fools a local test (E2E sends one per test).
      TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  worker:
    <<: *app
    pull_policy: never
    command: ["worker"]
    environment:
      <<: *db-urls
      DATABASE_WORKER_URL: postgres://crm_worker:crm-worker-dev-only@postgres:5432/crm
      # Email is worker only (web never sends); dev mail goes to Mailpit (docs/runbooks/phase-1-security.md, "Email").
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: "CRM Dev <dev@localhost>"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Dev mail catcher. UI and API on http://localhost:8025; SMTP on 1025, also on 127.0.0.1 for `pnpm worker:dev`.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  pgdata:
