name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:gates
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Mounting the checkout read-only at /repo lets gitleaks auto-detect /repo/.gitleaks.toml;
      # --config makes that explicit. Image pinned by digest (tag: v8.30.1).
      - name: gitleaks (full history)
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --exit-code 1

  # Decides whether the image and E2E jobs run. A pull request that changes only documentation (docs/, agents/, *.md)
  # skips them: they check nothing a docs change can break (DECISIONS 2026-11-12). Pushes to main, workflow changes and
  # anything uncertain run them. The three checks above still run.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=$(.github/scripts/code-changed.sh "$BASE_SHA" "$HEAD_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code (image and E2E jobs run only when true)" | tee -a "$GITHUB_STEP_SUMMARY"

  # Builds and scans the image and checks that it starts. The E2E jobs below wait for it, so a Trivy finding or a
  # stack that does not start stops the run before the browser tests (DECISIONS 2026-11-26).
  image:
    name: Image, Trivy, smoke
    runs-on: ubuntu-24.04
    needs: [checks, changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Throwaway values for this run only; the secret is random per run and never printed.
      - name: Write CI .env
        run: |
          {
            echo "DEPLOYMENT_MODE=selfhost"
            echo "APP_URL=http://localhost:3000"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "DATABASE_URL=postgres://crm_app:crm-app-dev-only@localhost:5433/crm"
            echo "DATABASE_MIGRATOR_URL=postgres://crm_migrator:crm-migrator-dev-only@localhost:5433/crm"
            echo "DATABASE_WORKER_URL=postgres://crm_worker:crm-worker-dev-only@localhost:5433/crm"
          } > .env
      - name: Build image
        run: docker compose -f docker/compose.dev.yml build
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: crm-app:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Start stack (role bootstrap, migrations, web, worker)
        id: stack
        run: docker compose -f docker/compose.dev.yml up -d --wait
      # PR #48: `up --wait` names only the container that exited. Print each service's own output right here. The
      # app logs name invalid variables, never their values (apps/web/src/lib/env.ts); nothing here echoes `.env`.
      - name: Service logs when the stack does not start
        if: failure() && steps.stack.outcome == 'failure'
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail=200
      # Bob PR #26: `pnpm dev` with only the root .env must serve /api/auth/ok. It needs the .env
      # written above, which the checks job does not have.
      - name: Smoke check of the auth route under pnpm dev
        run: pnpm smoke:auth-route

  # One job per Playwright project (FE-70 widths), each with its own fresh stack built from the same commit, in
  # parallel. The list must match the projects in apps/web/playwright.config.ts; apps/web/scripts/ci-e2e-matrix.test.ts
  # fails when they drift apart. No `always()`: when the image job fails or is skipped, these are skipped too.
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-24.04
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, tablet-768, mobile-320]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Throwaway values for this run only; the secret is random per run and never printed.
      - name: Write CI .env
        run: |
          {
            echo "DEPLOYMENT_MODE=selfhost"
            echo "APP_URL=http://localhost:3000"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "DATABASE_URL=postgres://crm_app:crm-app-dev-only@localhost:5433/crm"
            echo "DATABASE_MIGRATOR_URL=postgres://crm_migrator:crm-migrator-dev-only@localhost:5433/crm"
            echo "DATABASE_WORKER_URL=postgres://crm_worker:crm-worker-dev-only@localhost:5433/crm"
          } > .env
      - name: Build image
        run: docker compose -f docker/compose.dev.yml build
      - name: Start stack (role bootstrap, migrations, web, worker)
        id: stack
        run: docker compose -f docker/compose.dev.yml up -d --wait
      # PR #48: `up --wait` names only the container that exited. Print each service's own output right here. The
      # app logs name invalid variables, never their values (apps/web/src/lib/env.ts); nothing here echoes `.env`.
      - name: Service logs when the stack does not start
        if: failure() && steps.stack.outcome == 'failure'
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail=200
      - name: Install Playwright Chromium
        run: pnpm --filter @crm/web exec playwright install --with-deps chromium
      # No `--` before the flag: pnpm would pass it through and Playwright would then run every project.
      - name: E2E against the image
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_RATE_LIMITED: "1"
        run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Stack logs
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs --no-color | tee stack.log
      - name: Upload Playwright report and stack logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            stack.log
          retention-days: 7
          if-no-files-found: ignore
