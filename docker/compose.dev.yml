name: crm-dev

# Dev-only fixed credentials, reachable only on 127.0.0.1. Production passwords come from the
# host's secret store (UNI-08; docs/runbooks/phase-1-database-roles.md).
x-db-urls: &db-urls
  DATABASE_URL: postgres://crm_app:crm-app-dev-only@postgres:5432/crm
  DATABASE_MIGRATOR_URL: postgres://crm_migrator:crm-migrator-dev-only@postgres:5432/crm

# Dev-only MinIO credentials (root user, also used by the web container); production storage keys come from the
# host's secret store (docs/runbooks/phase-2-storage.md).
x-minio-root: &minio-root
  MINIO_ROOT_USER: crm-minio-dev-only
  MINIO_ROOT_PASSWORD: crm-minio-dev-only-password

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372

x-app: &app
  image: crm-app:dev
  env_file:
    - path: ../.env
      required: true
  environment: *db-urls
  read_only: true
  tmpfs:
    - /tmp
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-only
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates or repairs the five roles once, then exits (plan Task 1; runbook phase-1-database-roles).
  bootstrap:
    <<: *app
    pull_policy: never
    command: ["bootstrap"]
    restart: "no"
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres-dev-only@postgres:5432/crm
      CRM_MIGRATOR_PASSWORD: crm-migrator-dev-only
      CRM_APP_PASSWORD: crm-app-dev-only
      CRM_WORKER_PASSWORD: crm-worker-dev-only
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["web"]
    environment:
      <<: *db-urls
      # Dev only: no edge in front, and Next fills a missing X-Forwarded-For from the socket address. The port is
      # reachable only on 127.0.0.1, so a forged header only fools a local test (E2E sends one per test).
      TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      # Object storage (web only; docs/runbooks/phase-2-storage.md): the compose MinIO and its private bucket.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: crm-dev
      STORAGE_ACCESS_KEY_ID: crm-minio-dev-only
      STORAGE_SECRET_ACCESS_KEY: crm-minio-dev-only-password
      STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  worker:
    <<: *app
    pull_policy: never
    command: ["worker"]
    environment:
      <<: *db-urls
      DATABASE_WORKER_URL: postgres://crm_worker:crm-worker-dev-only@postgres:5432/crm
      # Email is worker only (web never sends); dev mail goes to Mailpit (docs/runbooks/phase-1-security.md, "Email").
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: "CRM Dev <dev@localhost>"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Dev mail catcher. UI and API on http://localhost:8025; SMTP on 1025, also on 127.0.0.1 for `pnpm worker:dev`.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Dev object storage (S3 API) on 127.0.0.1:9100 for `pnpm dev`; the web container reaches it as minio:9000. The image
  # is pinned by tag and index digest (UNI-14; docs/DECISIONS.md 2026-11-11).
  minio:
    image: *minio-image
    container_name: crm-minio
    command: ["server", "/data"]
    environment: *minio-root
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the private bucket once (no anonymous access), then exits. Safe to run again.
  minio-init:
    image: *minio-image
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set crm http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing crm/crm-dev
    environment: *minio-root
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
